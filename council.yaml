# LLM Council service configuration.
# API keys are NEVER stored here — they are read from the environment
# (see .env.example). key_env names the env var each provider needs.
#
# Model ids verified against the live APIs (see VERIFIED.md):
#   Mistral: mistral-large-4, deepseek-v4-1-flash-1017, zai-glm-5-3, zai-glm-5-3-flash
#   Ollama:  qwen3.8:27b-128k
#
# Vendor surface is deliberately minimal: Mistral API + local Ollama only.
# Fireworks was tried (minimax-m3) and removed to keep data on two vendors;
# the transport still supports it (see providers.py) — re-add a provider
# block + entry if needed. Prices in VERIFIED.md.

providers:
  ollama:
    # llm-server's Ollama; the same address works on the host and in the
    # agentsafe container (which maps llm-server in extra_hosts)
    base_url: http://llm-server:11434/v1
    timeout: 600                          # local inference is slow
  mistral:
    base_url: https://api.mistral.ai/v1
    key_env: MISTRAL_API_KEY
    # 300s: large reasoning models on big stage-3 prompts can exceed 120s
    timeout: 300
  # anthropic:
  #   key_env: ANTHROPIC_API_KEY
  #   max_tokens: 4096
  #   timeout: 120

councils:
  # Planning / brainstorming council (council-plan, --council default).
  # COLD path (runs periodically, latency tolerable). One seat per model
  # FAMILY: local qwen + deepseek-flash + glm-flash (all via Mistral).
  default:
    - {provider: ollama,  model: qwen3.8:27b-128k}
    - {provider: mistral, model: deepseek-v4-1-flash-1017}
    - {provider: mistral, model: zai-glm-5-3-flash}
  # Review council (council-review, --council review).
  # HOT path (runs every implement->review iteration). Three seats so each
  # issue gets two peer votes (with two seats, one vote decided every issue),
  # and three model families. Each stage waits for the slowest seat: measured
  # 2026-11-21, glm-flash took 93-136s per stage and local qwen 100-170s
  # (deepseek under 15s), so qwen's own 300s timeout caps how long it can
  # hold up a stage; a slower call is skipped with a stderr warning and shows
  # up in "failures". Ollama serves qwen one request at a time, so parallel
  # council runs queue on it.
  # HARD RULE: never add the implementer model here — a model grades its own
  # output with less scrutiny (familiarity bias). See DESIGN.md.
  review:
    - {provider: mistral, model: deepseek-v4-1-flash-1017}
    - {provider: mistral, model: zai-glm-5-3-flash}
    - {provider: ollama,  model: qwen3.8:27b-128k, timeout: 300}

# Models that write the code under review. `council --mode review` refuses
# any seat or chairman listed here (a model grades its own output with less
# scrutiny), so a fallback can't quietly seat the implementer.
implementers:
  - {provider: mistral, model: mistral-large-4}

chairmen:
  # Main-loop chairman: the orchestrator model, holds the goal context.
  # Chairmen get 600s: they read every report (mistral-large-4 took 201s and
  # glm-5-3 181s of the old 300s), and a chairman timeout fails the whole run.
  default: {provider: mistral, model: mistral-large-4, timeout: 600}
  # Review chairman must NOT be the implementer (mistral-large-4).
  # glm-5-3 costs ~$0.02 of a ~$0.03 review run; switch to zai-glm-5-3-flash
  # if review volume is high.
  review:  {provider: mistral, model: zai-glm-5-3, timeout: 600}
