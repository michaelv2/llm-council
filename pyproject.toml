[project]
name = "llm-council"
version = "0.2.0"
description = "Your LLM Council (service mode)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
]

[project.scripts]
council = "backend.cli:main"

# Without a build-system uv treats the project as virtual and never installs
# it, so the `council` script above is not created. Hatchling + explicit
# packages fixes that (uv sync then builds/installs the project).
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

# installed by default with `uv sync` (uv's default dev group)
[dependency-groups]
dev = [
    "pytest>=8.0",
]
